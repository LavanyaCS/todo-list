<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- META INFO -->
    <meta name="author" content="Lavanya Chandran">
    <meta name="description"
        content="A Simple Grade Calculator by Lavanya Chandran. Enter marks for five subjects, and calculate total, average, and grade using JavaScript.">
    <meta name="keywords"
        content="Grade Calculator, JavaScript Project, Lavanya Chandran, Student Projects, Web Development, JS Conditional Statements">
    <title>To Do List</title>
    <!--Custom Css-->
    <link href="css/style.css" rel="stylesheet" />
    <!--Bootstrap5 CSS CDN-->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!--Bootstrap5 JS CDN-->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!--font awesome-->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--Animate-->
  <link rel="stylesheet" href="assets/animate/animate.min.css" />


</head>

<body class="d-flex justify-content-center align-items-center">

   

    <!--hero section-->
   <div class="container d-flex justify-content-center align-items-center w-100 h-100">
      <div class="row justify-content-center">
    <div class="col-md-12 col-lg-12">
    <div class="todo-app d-flex justify-content-center align-items-center w-100">
            <h2 class="text-center mb-4">To Do List</h2>
         <form class="input-area d-flex justify-content-between align-items-center w-100">
            <input type="text" class="form-control flex-grow-1 px-4 py-2 fs-5 border-0 rounded-pill text-white" id="task-input" placeholder="Add a new Task ..."/>
            <button type="button" class="d-flex align-items-center justify-content-center ms-2 p-2 text-white" id="add-task-btn"><i class="fas fa-plus"></i></button>
         </form> 
          <div class="todos-container d-flex justify-content-center align-items-center">
            <ul id="task-list">
                <img src="images/empty-box.png" class="empty-image" alt="Empty"/>
            </ul>
          </div></div>
        </div>
</div></div>



 
    <!--Custom Script File-->
    <script src="js/script.js"></script>
</body>

</html>
